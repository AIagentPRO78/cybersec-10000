<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 760" role="img" aria-label="Diagram of cybersec-10000 v2.2: four entry commands feed a Rust chain-planner that scores chains with an exploitability factor. The static-analysis tier runs directly. The live-operations and specialist tiers pass through a fail-closed scope gate and run on an attack box with default-deny egress. Findings from every tier feed a purple-team output that maps each finding to an ATT&amp;CK technique, a D3FEND countermeasure and a deployable detection.">
        <defs>
          <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M0,0 L10,5 L0,10 z" fill="currentColor"/>
          </marker>
        </defs>

        <g style="color:#55606c" stroke="currentColor" stroke-width="1.5" fill="none">
          <line x1="275" y1="60" x2="275" y2="98" marker-end="url(#arrow)"/>
          <line x1="475" y1="60" x2="475" y2="98" marker-end="url(#arrow)"/>
          <line x1="655" y1="60" x2="655" y2="98" marker-end="url(#arrow)"/>
          <line x1="830" y1="60" x2="830" y2="98" marker-end="url(#arrow)"/>
        </g>

        <!-- entry commands -->
        <g font-family="IBM Plex Mono, monospace" font-size="13" font-weight="500">
          <rect x="180" y="24" width="190" height="36" rx="18" fill="none" stroke="#12181f" stroke-width="1.5"/>
          <text x="275" y="47" text-anchor="middle" fill="#12181f">/cybersec-scan</text>

          <rect x="400" y="24" width="150" height="36" rx="18" fill="none" stroke="#12181f" stroke-width="1.5"/>
          <text x="475" y="47" text-anchor="middle" fill="#12181f">/chain-plan</text>

          <rect x="580" y="24" width="150" height="36" rx="18" fill="none" stroke="#12181f" stroke-width="1.5"/>
          <text x="655" y="47" text-anchor="middle" fill="#12181f">/chain-run</text>

          <rect x="760" y="24" width="140" height="36" rx="18" fill="none" stroke="#12181f" stroke-width="1.5"/>
          <text x="830" y="47" text-anchor="middle" fill="#12181f">/war-room</text>
        </g>

        <!-- orchestration -->
        <rect x="80" y="100" width="920" height="70" rx="10" fill="#e3e7ec" stroke="#12181f" stroke-width="1.5"/>
        <text x="540" y="130" text-anchor="middle" font-family="IBM Plex Sans Condensed, sans-serif" font-weight="700" font-size="16" fill="#12181f">chain-planner orchestration (Rust)</text>
        <text x="540" y="151" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="11" fill="#55606c">47 chains · 136 capabilities · score = payout_prior × applicability × freshness_decay × exploitability (EPSS/KEV)</text>

        <!-- static path: direct, read-only -->
        <g style="color:#55606c" stroke="currentColor" stroke-width="1.5" fill="none">
          <line x1="190" y1="170" x2="190" y2="278" marker-end="url(#arrow)"/>
          <line x1="540" y1="170" x2="540" y2="190" marker-end="url(#arrow)"/>
          <line x1="890" y1="170" x2="890" y2="190" marker-end="url(#arrow)"/>
          <line x1="540" y1="242" x2="540" y2="278" marker-end="url(#arrow)"/>
          <line x1="890" y1="242" x2="890" y2="278" marker-end="url(#arrow)"/>
        </g>
        <text x="202" y="230" font-family="IBM Plex Mono, monospace" font-size="10" fill="#55606c">read-only</text>

        <!-- fail-closed scope gate (live + specialist path) -->
        <rect x="390" y="192" width="650" height="50" rx="8" fill="#ffffff" stroke="#12181f" stroke-width="2.5"/>
        <text x="715" y="213" text-anchor="middle" font-family="IBM Plex Sans Condensed, sans-serif" font-weight="700" font-size="13" fill="#12181f">FAIL-CLOSED SCOPE GATE</text>
        <text x="715" y="231" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="10" fill="#55606c">scope-check vs scope.yaml · validity window · out-of-scope wins · kill switch · non-zero = STOP</text>

        <!-- tier boxes -->
        <g>
          <!-- static -->
          <rect x="40" y="280" width="300" height="260" rx="10" fill="#ffffff" stroke="#b5731c" stroke-width="1.5"/>
          <text x="56" y="306" font-family="IBM Plex Sans Condensed, sans-serif" font-weight="700" font-size="14" fill="#b5731c">STATIC ANALYSIS</text>
          <text x="56" y="323" font-family="IBM Plex Mono, monospace" font-size="10.5" fill="#55606c">20 agents · 5,184 dims</text>
          <line x1="56" y1="332" x2="324" y2="332" stroke="#c7ced6"/>
          <g font-family="IBM Plex Mono, monospace" font-size="10.5" fill="#12181f">
            <text x="56" y="354">ai-llm-security (+Agentic/MCP Top 10)</text>
            <text x="56" y="384">supply-chain-deps (A03:2025)</text>
            <text x="56" y="414">architecture-threat-model (MAESTRO)</text>
            <text x="56" y="444">compliance (EU AI Act · ISO 27090)</text>
            <text x="56" y="474">injection-execution</text>
          </g>
          <text x="56" y="504" font-family="IBM Plex Mono, monospace" font-size="10.5" fill="#55606c">+15 more</text>

          <!-- live ops -->
          <rect x="390" y="280" width="300" height="260" rx="10" fill="#ffffff" stroke="#0f7d8c" stroke-width="1.5"/>
          <text x="406" y="306" font-family="IBM Plex Sans Condensed, sans-serif" font-weight="700" font-size="14" fill="#0f7d8c">LIVE OPERATIONS</text>
          <text x="406" y="323" font-family="IBM Plex Mono, monospace" font-size="10.5" fill="#55606c">16 agents · 3,087 dims</text>
          <line x1="406" y1="332" x2="674" y2="332" stroke="#c7ced6"/>
          <g font-family="IBM Plex Mono, monospace" font-size="10.5" fill="#12181f">
            <text x="406" y="354">warroom (enforces the gate)</text>
            <text x="406" y="384">recon-live</text>
            <text x="406" y="414">exploit-web / exploit-cloud</text>
            <text x="406" y="444">blue-team-watchdog (purple hub)</text>
            <text x="406" y="474">identity-ops · wireless · binexp</text>
          </g>
          <text x="406" y="504" font-family="IBM Plex Mono, monospace" font-size="10.5" fill="#55606c">+9 more</text>

          <!-- specialist -->
          <rect x="740" y="280" width="300" height="260" rx="10" fill="#ffffff" stroke="#a13d63" stroke-width="1.5"/>
          <text x="756" y="306" font-family="IBM Plex Sans Condensed, sans-serif" font-weight="700" font-size="14" fill="#a13d63">SPECIALIST</text>
          <text x="756" y="323" font-family="IBM Plex Mono, monospace" font-size="10.5" fill="#55606c">4 agents · 2,010 dims</text>
          <line x1="756" y1="332" x2="1024" y2="332" stroke="#c7ced6"/>
          <g font-family="IBM Plex Mono, monospace" font-size="10.5" fill="#12181f">
            <text x="756" y="354">deception-honeypot</text>
            <text x="756" y="384">threat-intelligence (EPSS/KEV/SSVC)</text>
            <text x="756" y="414">iot-embedded (ATT&amp;CK ICS v20)</text>
            <text x="756" y="444">vuln-research (validation-first)</text>
          </g>
        </g>

        <!-- to attack box -->
        <g style="color:#0f7d8c" stroke="currentColor" stroke-width="1.5" fill="none">
          <line x1="540" y1="540" x2="540" y2="568" marker-end="url(#arrow)"/>
          <line x1="890" y1="540" x2="890" y2="568" marker-end="url(#arrow)"/>
        </g>
        <rect x="390" y="570" width="650" height="60" rx="8" fill="none" stroke="#0f7d8c" stroke-width="1.5"/>
        <text x="715" y="593" text-anchor="middle" font-family="IBM Plex Sans Condensed, sans-serif" font-weight="700" font-size="13" fill="#0f7d8c">ATTACK BOX</text>
        <text x="715" y="611" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="10" fill="#55606c">Vultr VPS · WireGuard tunnel · default-deny egress (nftables via scope-egress) · deny log + alert</text>

        <!-- to purple-team output -->
        <g style="color:#5b3fa0" stroke="currentColor" stroke-width="1.5" fill="none">
          <line x1="190" y1="540" x2="190" y2="668" marker-end="url(#arrow)"/>
          <line x1="715" y1="630" x2="715" y2="668" marker-end="url(#arrow)"/>
        </g>
        <text x="202" y="610" font-family="IBM Plex Mono, monospace" font-size="10" fill="#55606c">findings</text>
        <text x="727" y="654" font-family="IBM Plex Mono, monospace" font-size="10" fill="#55606c">findings</text>
        <rect x="40" y="670" width="1000" height="66" rx="10" fill="#f1edf9" stroke="#5b3fa0" stroke-width="1.5"/>
        <text x="540" y="696" text-anchor="middle" font-family="IBM Plex Sans Condensed, sans-serif" font-weight="700" font-size="14" fill="#5b3fa0">PURPLE-TEAM OUTPUT</text>
        <text x="540" y="716" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="10.5" fill="#55606c">every finding → ATT&amp;CK v20.1 / ATLAS v2026.10 → D3FEND countermeasure → deployable detection (Sigma · OCSF) + EPSS/KEV/SSVC + validation</text>
      </svg>
